name: PRJ-019 M12 Live Shadow Dispatch Proof
on:
  push:
    branches: [prj019-m12-live-shadow-dispatch]
    paths: [.github/workflows/prj019-m12-live-shadow-dispatch.yml, prj019/m12/canonical-snapshot-v001.json]
permissions:
  contents: read
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAPERCLIP_VERSION: "2026.722.0"
      PAPERCLIP_BIND_MODE: loopback
      HOST: "127.0.0.1"
      PORT: "3100"
      PAPERCLIP_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      BASE_URL: http://127.0.0.1:3100
      MAIN_SHA_BASELINE: 27f7b5894c2ff3dc28c06d56817f4aa4b9a74e2d
      EXPECTED_CONTRACT_SHA256: 0a85924d1e754623a4b90255deeca1abff1df117e472891b497f45203261456c
      EXPECTED_SNAPSHOT_SHA256: 1fb1292b803e959e71f01b37d6e0c2e202b9ff93447e3d2e9fa7d619ed980dea
      EXPECTED_PHYSICAL_SHA256: 006f866124f90f79721bddb167db257d7dd95f211050d20977a1c1f8b6f00e0b
      CANONICAL_RESUME_POINTER: CP-PRJ019-M12-002
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Execute locked D01-D10
        shell: bash
        run: |
          set -Eeuo pipefail
          export PAPERCLIP_HOME="$RUNNER_TEMP/prj019-m12-paperclip-home"
          E="$GITHUB_WORKSPACE/m12-evidence"; S="$GITHUB_WORKSPACE/prj019/m12/canonical-snapshot-v001.json"; WO="$RUNNER_TEMP/prj019-m12-worker-output.json"
          mkdir -p "$E"; exec > >(tee "$E/harness.log") 2>&1
          pass(){ echo "PASS $1"|tee -a "$E/results.txt"; }
          fail(){ echo "FAIL $1 :: $2"|tee -a "$E/results.txt"; exit 1; }
          get(){ curl --fail-with-body -sS "$BASE_URL$1"; }
          post(){ curl --fail-with-body -sS -H 'Content-Type: application/json' -X POST "$BASE_URL$1" -d "$2"; }
          patch(){ curl --fail-with-body -sS -H 'Content-Type: application/json' -X PATCH "$BASE_URL$1" -d "$2"; }
          up(){ curl -sf "$BASE_URL/api/health" >/dev/null 2>&1; }
          waitup(){ for _ in $(seq 1 120); do up && return 0; sleep 2; done; return 1; }
          stable_down(){
            for _ in 1 2 3; do up && return 1; [[ -z "$(lsof -tiTCP:3100 -sTCP:LISTEN 2>/dev/null || true)" ]] || return 1; sleep 1; done
          }
          startpc(){
            nohup npx --yes --registry https://registry.npmjs.org "paperclipai@$PAPERCLIP_VERSION" onboard --yes >"$E/server-$1.log" 2>&1 &
            echo $! >"$E/$1-launcher.pid"; waitup || { cat "$E/server-$1.log"||true; return 1; }
            LP=$(lsof -tiTCP:3100 -sTCP:LISTEN 2>/dev/null|head -n1||true); [[ -n "$LP" && "$LP" != "$$" ]] || return 1
            echo "$LP" >"$E/$1-listener.pid"; echo "listener=$LP"
          }
          stoppc(){
            local p; p=$(lsof -tiTCP:3100 -sTCP:LISTEN 2>/dev/null||true)
            [[ -z "$p" ]] || kill $p 2>/dev/null||true
            for _ in $(seq 1 10); do stable_down && { LP=""; return 0; }; sleep 1; done
            p=$(lsof -tiTCP:3100 -sTCP:LISTEN 2>/dev/null||true); [[ -z "$p" ]] || kill -9 $p 2>/dev/null||true
            stable_down; LP=""
          }
          trap 'stoppc || true' EXIT
          cp "$S" "$E/canonical-snapshot-v001.json"; cp "$GITHUB_WORKSPACE/.github/workflows/prj019-m12-live-shadow-dispatch.yml" "$E/workflow.yml"
          echo '{"reverse_write_count":0,"canonical_mutation_count":0,"production_action_count":0,"public_service_exposure_count":0,"credential_provider_secret_use_count":0,"money_commitment_count":0,"paid_model_api_call_count":0,"main_branch_mutation_count":0,"canonical_pass_decision_by_paperclip_count":0}' >"$E/side_effect_counters.json"

          jq -e '.snapshot_schema=="PRJ019_CANONICAL_SNAPSHOT_V1" and .canonical_payload.project_id=="PRJ-019" and .canonical_payload.task_id=="TASK-018" and .canonical_payload.human_gate.type=="HG-1" and .canonical_payload.contract_id=="M12-LIVE-SHADOW-DISPATCH-v0.1"' "$S" >/dev/null||fail D01 fields
          SH=$(python3 - "$S" <<'PY'
          import hashlib,json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))['canonical_payload']
          print(hashlib.sha256(json.dumps(d,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest())
          PY
          )
          EH=$(jq -r .snapshot_sha256 "$S"); CH=$(jq -r .canonical_payload.contract_sha256 "$S"); FH=$(sha256sum "$S"|awk '{print $1}')
          [[ "$SH" == "$EH" && "$SH" == "$EXPECTED_SNAPSHOT_SHA256" && "$CH" == "$EXPECTED_CONTRACT_SHA256" && "$FH" == "$EXPECTED_PHYSICAL_SHA256" ]]||fail D01 hash
          jq -n --arg sh "$SH" --arg fh "$FH" --arg ch "$CH" '{canonical_payload_sha256:$sh,physical_file_sha256:$fh,contract_sha256:$ch}' >"$E/d01-integrity.json"; pass D01

          npm view "paperclipai@$PAPERCLIP_VERSION" version dist.tarball dist.integrity --json >"$E/npm-package.json"; [[ $(jq -r .version "$E/npm-package.json") == "$PAPERCLIP_VERSION" ]]||fail D02 version
          startpc first||fail D02 startup; get /api/health|jq . >"$E/health-first.json"; [[ $(jq -r .deploymentExposure "$E/health-first.json") == private ]]||fail D02 exposure; pass D02

          PROJECT_ID=$(jq -r .canonical_payload.project_id "$S"); FACTORY=$(jq -r .canonical_payload.factory_version "$S"); STAGE=$(jq -r .canonical_payload.stage "$S"); MILESTONE=$(jq -r .canonical_payload.milestone "$S"); TASK=$(jq -r .canonical_payload.task_id "$S"); TSTATUS=$(jq -r .canonical_payload.task_status "$S"); OWNER=$(jq -r .canonical_payload.canonical_owner "$S"); ROLE=$(jq -r .canonical_payload.paperclip_role "$S"); CONTRACT=$(jq -r .canonical_payload.contract_id "$S"); HGT=$(jq -r .canonical_payload.human_gate.type "$S"); HGS=$(jq -r .canonical_payload.human_gate.status "$S"); HGSCOPE=$(jq -r .canonical_payload.human_gate.scope "$S")
          C=$(post /api/companies "$(jq -nc --arg n "$PROJECT_ID M12 Shadow Company" --arg d "canonical_owner=$OWNER; snapshot_sha256=$SH; paperclip_role=$ROLE; shadow_only=true" '{name:$n,description:$d,budgetMonthlyCents:0}')")||fail D03 company; CID=$(jq -r .id<<<"$C")
          G=$(post "/api/companies/$CID/goals" "$(jq -nc --arg t "$MILESTONE" --arg d "canonical_stage=$STAGE; contract_id=$CONTRACT; snapshot_sha256=$SH; shadow_only=true" '{title:$t,description:$d,level:"task",status:"planned"}')")||fail D03 goal; GID=$(jq -r .id<<<"$G")
          P=$(post "/api/companies/$CID/projects" "$(jq -nc --arg g "$GID" --arg n "$PROJECT_ID | M12 Shadow Dispatch" --arg d "factory_version=$FACTORY; canonical_stage=$STAGE; snapshot_sha256=$SH; shadow_only=true" '{goalIds:[$g],name:$n,description:$d,status:"backlog"}')")||fail D03 project; PID=$(jq -r .id<<<"$P")
          IB="canonical_task_id=$TASK; canonical_snapshot_task_status=$TSTATUS; canonical_stage=$STAGE; human_gate=$HGT:$HGS; human_gate_scope=$HGSCOPE; snapshot_sha256=$SH; shadow_only=true"
          I=$(post "/api/companies/$CID/issues" "$(jq -nc --arg p "$PID" --arg g "$GID" --arg t "$TASK | SHADOW_DISPATCH_PENDING" --arg d "$IB" '{projectId:$p,goalId:$g,title:$t,description:$d,priority:"medium"}')")||fail D03 issue; IID=$(jq -r .id<<<"$I")
          read -r -d '' WC <<'WORKER'||true
          set -Eeuo pipefail
          T=$(jq -r '.canonical_payload.task_id' "$SNAPSHOT_PATH")
          M=$(jq -r '.canonical_payload.milestone' "$SNAPSHOT_PATH")
          H=$(python3 -c 'import hashlib,json,sys; d=json.load(open(sys.argv[1],encoding="utf-8"))["canonical_payload"]; print(hashlib.sha256(json.dumps(d,ensure_ascii=False,sort_keys=True,separators=(",",":")).encode()).hexdigest())' "$SNAPSHOT_PATH")
          jq -n --arg task "$T" --arg milestone "$M" --arg sh "$H" '{worker_verdict:"PASS",canonical_task_id:$task,milestone:$milestone,snapshot_sha256:$sh,work_type:"deterministic_snapshot_proof",side_effects:0}' >"$WORKER_OUTPUT_PATH"
          echo "PRJ019_M12_WORKER_OK task=$T snapshot_sha256=$H"; cat "$WORKER_OUTPUT_PATH"
          WORKER
          AB=$(jq -nc --arg sh "$SH" --arg task "$TASK" --arg issue "$IID" --arg sp "$S" --arg op "$WO" --arg code "$WC" '{name:"PRJ019-M12-Dispatch-Worker",role:"qa",adapterType:"process",adapterConfig:{command:"/bin/bash",args:["-lc",$code],env:{SNAPSHOT_PATH:$sp,WORKER_OUTPUT_PATH:$op},timeoutSec:60},runtimeConfig:{heartbeat:{enabled:false}},budgetMonthlyCents:0,metadata:{snapshot_sha256:$sh,canonical_task_id:$task,shadow_issue_id:$issue,shadow_only:true}}')
          A=$(post "/api/companies/$CID/agents" "$AB")||fail D03 agent; AID=$(jq -r .id<<<"$A"); IL="$IB; shadow_agent_id=$AID"
          patch "/api/issues/$IID" "$(jq -nc --arg d "$IL" '{description:$d}')"|jq . >"$E/issue-link.json"||fail D03 link
          get "/api/issues/$IID"|jq . >"$E/i-linked.json"; get "/api/agents/$AID"|jq . >"$E/a-linked.json"
          [[ $(jq -r .description "$E/i-linked.json") == "$IL" && $(jq -r .metadata.canonical_task_id "$E/a-linked.json") == "$TASK" && $(jq -r .metadata.snapshot_sha256 "$E/a-linked.json") == "$SH" && $(jq -r .metadata.shadow_issue_id "$E/a-linked.json") == "$IID" ]]||fail D03 readback
          jq -n --arg c "$CID" --arg g "$GID" --arg p "$PID" --arg i "$IID" --arg a "$AID" '{company_id:$c,goal_id:$g,project_id:$p,issue_id:$i,agent_id:$a}' >"$E/d03-object-ids.json"; pass D03

          W=$(post "/api/agents/$AID/wakeup" "$(jq -nc --arg task "$TASK" --arg sh "$SH" --arg issue "$IID" '{source:"on_demand",reason:"PRJ-019 M12 D04 shadow dispatch",payload:{canonical_task_id:$task,snapshot_sha256:$sh,shadow_issue_id:$issue},idempotencyKey:"PRJ019-M12-D04-v001"}')")||fail D04 wake; echo "$W"|jq . >"$E/wakeup.json"; RID=$(jq -r .id<<<"$W"); [[ -n "$RID" ]]||fail D04 id; pass D04
          RS=""; for _ in $(seq 1 120); do get "/api/heartbeat-runs/$RID"|jq . >"$E/run.json"||true; RS=$(jq -r '.status//empty' "$E/run.json" 2>/dev/null||true); case "$RS" in queued|running|"") sleep 1;; *) break;; esac; done
          get "/api/heartbeat-runs/$RID/log?limitBytes=262144"|jq . >"$E/log.json"||true; get "/api/heartbeat-runs/$RID/events?limit=200"|jq . >"$E/events.json"||true
          [[ -f "$WO" ]]||fail D05 output; cp "$WO" "$E/worker-output.json"; [[ $(jq -r .worker_verdict "$E/worker-output.json") == PASS && $(jq -r .canonical_task_id "$E/worker-output.json") == "$TASK" && $(jq -r .snapshot_sha256 "$E/worker-output.json") == "$SH" && $(jq -r .side_effects "$E/worker-output.json") == 0 ]]||fail D05 identity; pass D05
          [[ "$RS" == succeeded ]]||fail D06 "status=$RS"; grep -q PRJ019_M12_WORKER_OK "$E/log.json"&&grep -q "$TASK" "$E/log.json"&&grep -q "$SH" "$E/log.json"||fail D06 trace; jq -n --arg rid "$RID" --arg status "$RS" --arg task "$TASK" --arg sh "$SH" '{heartbeat_run_id:$rid,status:$status,canonical_task_id:$task,snapshot_sha256:$sh,traceable:true}' >"$E/d06-trace.json"; pass D06

          CT="$TASK | SHADOW_WORKER_COMPLETED"; CD="$IL; shadow_completion=true; heartbeat_run_id=$RID; worker_verdict=PASS; canonical_pass_decision_by_paperclip=false"
          patch "/api/issues/$IID" "$(jq -nc --arg t "$CT" --arg d "$CD" '{title:$t,description:$d}')"|jq . >"$E/issue-complete.json"||fail D07 patch; get "/api/issues/$IID"|jq . >"$E/i-complete.json"
          [[ $(jq -r .title "$E/i-complete.json") == "$CT" && $(jq -r .description "$E/i-complete.json") == "$CD" && $(sha256sum "$S"|awk '{print $1}') == "$FH" ]]||fail D07 boundary
          jq -n --arg status "$TSTATUS" --arg resume "$CANONICAL_RESUME_POINTER" '{paperclip_shadow_completion:true,locked_snapshot_task_status:$status,canonical_pass_decision_by_paperclip:false,drive_write_capability_in_runner:false,canonical_resume_pointer:$resume}' >"$E/d07-authority.json"; pass D07

          stoppc||fail D08 stop; up&&fail D08 down; echo FIRST_RUNTIME_CONFIRMED_DOWN >"$E/restart-boundary.txt"; startpc second||fail D08 restart
          get "/api/companies/$CID"|jq . >"$E/c2.json"; get "/api/goals/$GID"|jq . >"$E/g2.json"; get "/api/projects/$PID"|jq . >"$E/p2.json"; get "/api/issues/$IID"|jq . >"$E/i2.json"; get "/api/agents/$AID"|jq . >"$E/a2.json"; get "/api/heartbeat-runs/$RID"|jq . >"$E/r2.json"; get "/api/heartbeat-runs/$RID/log?limitBytes=262144"|jq . >"$E/l2.json"
          [[ $(jq -r .id "$E/c2.json") == "$CID" && $(jq -r .id "$E/g2.json") == "$GID" && $(jq -r .id "$E/p2.json") == "$PID" && $(jq -r .id "$E/i2.json") == "$IID" && $(jq -r .title "$E/i2.json") == "$CT" && $(jq -r .id "$E/a2.json") == "$AID" && $(jq -r .id "$E/r2.json") == "$RID" && $(jq -r .status "$E/r2.json") == succeeded ]]||fail D08 persistence
          grep -q PRJ019_M12_WORKER_OK "$E/l2.json"||fail D08 log; [[ -f "$WO" ]]||fail D08 evidence; echo "canonical_resume_pointer=$CANONICAL_RESUME_POINTER; canonical_owner=$OWNER" >"$E/d08-resume.txt"; pass D08

          for k in GOOGLE_APPLICATION_CREDENTIALS GOOGLE_DRIVE_TOKEN GDRIVE_TOKEN OPENAI_API_KEY ANTHROPIC_API_KEY GEMINI_API_KEY GOOGLE_API_KEY; do [[ -z "${!k:-}" ]]||fail D09 "credential=$k"; done
          MS=$(curl -fsSL https://api.github.com/repos/domeagloco/durmbarai-website/commits/main|jq -r .sha); [[ "$MS" == "$MAIN_SHA_BASELINE" ]]||fail D09 main
          jq -n --arg b "$MAIN_SHA_BASELINE" --arg c "$MS" '{main_sha_baseline:$b,main_sha_after_runtime:$c,unchanged:($b==$c)}' >"$E/d09-main.json"
          jq -e '.reverse_write_count==0 and .canonical_mutation_count==0 and .production_action_count==0 and .public_service_exposure_count==0 and .credential_provider_secret_use_count==0 and .money_commitment_count==0 and .paid_model_api_call_count==0 and .main_branch_mutation_count==0 and .canonical_pass_decision_by_paperclip_count==0' "$E/side_effect_counters.json" >/dev/null||fail D09 counters; pass D09

          stoppc||fail D10 cleanup; up&&fail D10 health
          jq -n --arg pv "$PAPERCLIP_VERSION" --arg sh "$SH" --arg fh "$FH" --arg ch "$CH" --arg c "$CID" --arg g "$GID" --arg p "$PID" --arg i "$IID" --arg a "$AID" --arg r "$RID" --arg rs "$RS" --arg resume "$CANONICAL_RESUME_POINTER" '{project_id:"PRJ-019",milestone:"M12",scope:"ISOLATED_SANDBOX_ONLY",paperclip_version:$pv,snapshot_sha256:$sh,physical_snapshot_sha256:$fh,contract_sha256:$ch,company_id:$c,goal_id:$g,project_id_runtime:$p,issue_id:$i,agent_id:$a,heartbeat_run_id:$r,heartbeat_status:$rs,canonical_resume_pointer:$resume,reverse_write_count:0,canonical_mutation_count:0,production_action_count:0,credential_provider_secret_use_count:0,money_commitment_count:0,paid_model_api_call_count:0,public_service_exposure_count:0,main_branch_mutation_count:0,canonical_pass_decision_by_paperclip_count:0}' >"$E/runtime-manifest.json"; pass D10
          PC=$(grep -c '^PASS D' "$E/results.txt"||true); WCNT=$(grep -c '^WARN ' "$E/results.txt"||true); FC=$(grep -c '^FAIL ' "$E/results.txt"||true); [[ "$PC/$WCNT/$FC" == 10/0/0 ]]||fail FINAL "$PC/$WCNT/$FC"; echo M12_LIVE_SHADOW_DISPATCH_VERDICT=PASS|tee "$E/verdict.txt"
      - name: Upload M12 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: prj019-m12-live-shadow-dispatch-evidence
          path: m12-evidence/
          if-no-files-found: error
          retention-days: 30
