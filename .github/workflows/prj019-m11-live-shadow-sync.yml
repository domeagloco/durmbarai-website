name: PRJ-019 M11 Live Shadow Sync Proof
on:
  push:
    branches: [prj019-m11-live-shadow-sync]
    paths:
      - .github/workflows/prj019-m11-live-shadow-sync.yml
      - prj019/m11/canonical-snapshot-v001.json
permissions:
  contents: read
jobs:
  live-shadow-sync-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PAPERCLIP_VERSION: "2026.722.0"
      HOST: "127.0.0.1"
      PORT: "3100"
      PAPERCLIP_TELEMETRY_DISABLED: "1"
      DO_NOT_TRACK: "1"
      BASE_URL: http://127.0.0.1:3100
      MAIN_SHA_BASELINE: 27f7b5894c2ff3dc28c06d56817f4aa4b9a74e2d
      EXPECTED_CONTRACT_SHA256: b8a98720271f3aa7a811fa887a0b356ae97f9be7b938695bbd794a1601420031
      EXPECTED_SNAPSHOT_SHA256: 44d274d336e8f24fe37111f861ea15e8790882a1db771e683710c8425a21e989
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - name: Execute locked S01-S10 live shadow-sync proof
        shell: bash
        run: |
          set -Eeuo pipefail
          export PAPERCLIP_HOME="$RUNNER_TEMP/prj019-m11-paperclip-home"
          E="$GITHUB_WORKSPACE/m11-evidence"; S="$GITHUB_WORKSPACE/prj019/m11/canonical-snapshot-v001.json"
          mkdir -p "$E"; exec > >(tee "$E/harness.log") 2>&1
          pass(){ echo "PASS $1" | tee -a "$E/results.txt"; }
          fail(){ echo "FAIL $1 :: $2" | tee -a "$E/results.txt"; exit 1; }
          get(){ curl --fail-with-body -sS "$BASE_URL$1"; }
          post(){ curl --fail-with-body -sS -H 'Content-Type: application/json' -X POST "$BASE_URL$1" -d "$2"; }
          patch(){ curl --fail-with-body -sS -H 'Content-Type: application/json' -X PATCH "$BASE_URL$1" -d "$2"; }
          up(){ curl -sf "$BASE_URL/api/health" >/dev/null 2>&1; }
          waitup(){ for _ in $(seq 1 120); do up && return 0; sleep 2; done; return 1; }
          waitdown(){ for _ in $(seq 1 30); do up || return 0; sleep 1; done; return 1; }
          startpc(){
            echo "start Paperclip $PAPERCLIP_VERSION process-group"
            nohup setsid npx --yes --registry https://registry.npmjs.org "paperclipai@$PAPERCLIP_VERSION" onboard --yes >"$E/server-$1.log" 2>&1 &
            PCPID=$!; PCPGID=$(ps -o pgid= -p "$PCPID" | tr -d ' ' || true)
            echo "$PCPID" >"$E/$1.pid"; echo "$PCPGID" >"$E/$1.pgid"
            [[ -n "$PCPGID" ]] && waitup || { cat "$E/server-$1.log" || true; return 1; }
          }
          stoppc(){
            if [[ -n "${PCPGID:-}" ]]; then echo "stop process-group $PCPGID"; kill -TERM -- "-$PCPGID" 2>/dev/null || true; fi
            sleep 1
            P=$(lsof -tiTCP:3100 -sTCP:LISTEN 2>/dev/null || true); [[ -z "$P" ]] || kill $P 2>/dev/null || true
            for _ in $(seq 1 10); do
              if ! up && [[ -z "$(lsof -tiTCP:3100 -sTCP:LISTEN 2>/dev/null || true)" ]]; then sleep 1; ! up && { PCPID=""; PCPGID=""; return 0; }; fi
              sleep 1
            done
            [[ -z "${PCPGID:-}" ]] || kill -KILL -- "-$PCPGID" 2>/dev/null || true
            P=$(lsof -tiTCP:3100 -sTCP:LISTEN 2>/dev/null || true); [[ -z "$P" ]] || kill -9 $P 2>/dev/null || true
            waitdown || return 1; [[ -z "$(lsof -tiTCP:3100 -sTCP:LISTEN 2>/dev/null || true)" ]] || return 1
            PCPID=""; PCPGID=""
          }
          trap 'stoppc || true' EXIT
          cp "$S" "$E/canonical-snapshot-v001.json"; cp "$GITHUB_WORKSPACE/.github/workflows/prj019-m11-live-shadow-sync.yml" "$E/workflow.yml"
          echo '{"reverse_write_count":0,"canonical_mutation_count":0,"production_action_count":0,"public_service_exposure_count":0,"credential_provider_secret_mutation_count":0,"money_commitment_count":0,"main_branch_mutation_count":0}' >"$E/side_effect_counters.json"

          jq -e '.snapshot_schema=="PRJ019_CANONICAL_SNAPSHOT_V1" and .canonical_payload.project_id and .canonical_payload.stage and .canonical_payload.milestone and .canonical_payload.task_id and .canonical_payload.human_gate.type and .canonical_payload.human_gate.status and .canonical_payload.resume_checkpoint_id and .canonical_payload.contract_id' "$S" >/dev/null || fail S01 fields
          SH=$(python - "$S" <<'PY'
          import hashlib,json,sys
          d=json.load(open(sys.argv[1],encoding='utf-8'))['canonical_payload']
          print(hashlib.sha256(json.dumps(d,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest())
          PY
          )
          EH=$(jq -r .snapshot_sha256 "$S"); CH=$(jq -r .canonical_payload.contract_sha256 "$S"); FH=$(sha256sum "$S"|awk '{print $1}')
          [[ "$SH" == "$EH" && "$SH" == "$EXPECTED_SNAPSHOT_SHA256" && "$CH" == "$EXPECTED_CONTRACT_SHA256" ]] || fail S01 hash
          jq -n --arg sh "$SH" --arg fh "$FH" --arg ch "$CH" '{canonical_payload_sha256:$sh,physical_file_sha256:$fh,contract_sha256:$ch}' >"$E/s01-integrity.json"; pass S01

          npm view "paperclipai@$PAPERCLIP_VERSION" version dist.tarball dist.integrity --json >"$E/npm-package.json"
          [[ $(jq -r .version "$E/npm-package.json") == "$PAPERCLIP_VERSION" ]] || fail S02 version
          startpc first || fail S02 startup; get /api/health | jq . >"$E/health-first.json"
          [[ $(jq -r '.deploymentExposure' "$E/health-first.json") == private ]] || fail S02 exposure; pass S02

          PROJECT_ID=$(jq -r .canonical_payload.project_id "$S"); FACTORY=$(jq -r .canonical_payload.factory_version "$S"); STAGE=$(jq -r .canonical_payload.stage "$S"); MILESTONE=$(jq -r .canonical_payload.milestone "$S")
          TASK=$(jq -r .canonical_payload.task_id "$S"); TSTATUS=$(jq -r .canonical_payload.task_status "$S"); HGT=$(jq -r .canonical_payload.human_gate.type "$S"); HGS=$(jq -r .canonical_payload.human_gate.status "$S"); HGSCOPE=$(jq -r .canonical_payload.human_gate.scope "$S")
          OWNER=$(jq -r .canonical_payload.canonical_owner "$S"); ROLE=$(jq -r .canonical_payload.paperclip_role "$S"); RESUME=$(jq -r .canonical_payload.resume_checkpoint_id "$S"); CONTRACT=$(jq -r .canonical_payload.contract_id "$S")
          CN="$PROJECT_ID M11 Shadow Company"; CD="canonical_owner=$OWNER; snapshot_sha256=$SH; paperclip_role=$ROLE"
          GT="$MILESTONE"; GD="canonical_stage=$STAGE; contract_id=$CONTRACT; snapshot_sha256=$SH"
          PN="$PROJECT_ID | M11 Shadow Sync"; PD="factory_version=$FACTORY; canonical_stage=$STAGE; resume_checkpoint_id=$RESUME; shadow_only=true"
          IT="$TASK | $TSTATUS"; ID="canonical_stage=$STAGE; human_gate=$HGT:$HGS; human_gate_scope=$HGSCOPE; resume_checkpoint_id=$RESUME; snapshot_sha256=$SH; shadow_only=true"

          C=$(post /api/companies "$(jq -nc --arg n "$CN" --arg d "$CD" '{name:$n,description:$d,budgetMonthlyCents:0}')") || fail S03 company; CID=$(jq -r .id<<<"$C")
          G=$(post "/api/companies/$CID/goals" "$(jq -nc --arg t "$GT" --arg d "$GD" '{title:$t,description:$d,level:"task",status:"planned"}')") || fail S03 goal; GID=$(jq -r .id<<<"$G")
          P=$(post "/api/companies/$CID/projects" "$(jq -nc --arg g "$GID" --arg n "$PN" --arg d "$PD" '{goalIds:[$g],name:$n,description:$d,status:"backlog"}')") || fail S03 project; PID=$(jq -r .id<<<"$P")
          I=$(post "/api/companies/$CID/issues" "$(jq -nc --arg p "$PID" --arg g "$GID" --arg t "$IT" --arg d "$ID" '{projectId:$p,goalId:$g,title:$t,description:$d,priority:"medium"}')") || fail S03 issue; IID=$(jq -r .id<<<"$I")
          A=$(post "/api/companies/$CID/agents" "$(jq -nc --arg s "$SH" --arg t "$TASK" --arg h "$HGS" --arg r "$RESUME" '{name:"PRJ019-M11-Shadow-Agent",role:"qa",adapterType:"process",adapterConfig:{command:"/bin/bash",args:["-lc","echo PRJ019_M11_SHADOW_ONLY"],timeoutSec:30},runtimeConfig:{heartbeat:{enabled:false}},budgetMonthlyCents:0,metadata:{snapshot_sha256:$s,canonical_task_id:$t,canonical_human_gate_status:$h,canonical_resume_checkpoint_id:$r,shadow_only:true}}')") || fail S03 agent; AID=$(jq -r .id<<<"$A")
          [[ -n "$CID" && -n "$GID" && -n "$PID" && -n "$IID" && -n "$AID" ]] || fail S03 ids
          jq -n --arg c "$CID" --arg g "$GID" --arg p "$PID" --arg i "$IID" --arg a "$AID" '{company_id:$c,goal_id:$g,project_id:$p,issue_id:$i,agent_id:$a}' >"$E/s03-object-ids.json"; pass S03

          get "/api/companies/$CID"|jq . >"$E/c.json"; get "/api/goals/$GID"|jq . >"$E/g.json"; get "/api/projects/$PID"|jq . >"$E/p.json"; get "/api/issues/$IID"|jq . >"$E/i.json"; get "/api/agents/$AID"|jq . >"$E/a.json"
          [[ $(jq -r .name "$E/c.json") == "$CN" && $(jq -r .description "$E/c.json") == "$CD" ]] || fail S04 company
          [[ $(jq -r .title "$E/g.json") == "$GT" && $(jq -r .description "$E/g.json") == "$GD" ]] || fail S04 goal
          [[ $(jq -r .name "$E/p.json") == "$PN" && $(jq -r .description "$E/p.json") == "$PD" ]] || fail S04 project
          [[ $(jq -r .title "$E/i.json") == "$IT" && $(jq -r .description "$E/i.json") == "$ID" ]] || fail S04 issue
          [[ $(jq -r .metadata.snapshot_sha256 "$E/a.json") == "$SH" && $(jq -r .metadata.canonical_task_id "$E/a.json") == "$TASK" && $(jq -r .metadata.canonical_resume_checkpoint_id "$E/a.json") == "$RESUME" ]] || fail S04 agent; pass S04

          DT=PAPERCLIP_DRIFT_SHOULD_NOT_WIN; DD='paperclip_only_drift=true; canonical_snapshot_must_win_on_resync'
          patch "/api/issues/$IID" "$(jq -nc --arg t "$DT" --arg d "$DD" '{title:$t,description:$d}')" | jq . >"$E/drift-patch.json" || fail S05 patch
          get "/api/issues/$IID"|jq . >"$E/after-drift.json"; [[ $(jq -r .title "$E/after-drift.json") == "$DT" && $(jq -r .description "$E/after-drift.json") == "$DD" && $(sha256sum "$S"|awk '{print $1}') == "$FH" ]] || fail S05 detect
          jq -n --arg canonical "$IT" --arg drift "$DT" '{drift_detected:true,canonical_title:$canonical,paperclip_drift_title:$drift,drive_write_capability_in_runner:false}' >"$E/s05-drift.json"; pass S05

          patch "/api/issues/$IID" "$(jq -nc --arg t "$IT" --arg d "$ID" '{title:$t,description:$d}')"|jq . >"$E/resync-patch.json" || fail S06 patch
          get "/api/issues/$IID"|jq . >"$E/after-resync.json"; [[ $(jq -r .title "$E/after-resync.json") == "$IT" && $(jq -r .description "$E/after-resync.json") == "$ID" ]] || fail S06 restore
          jq -n --arg sh "$SH" --arg t "$IT" '{resync_source:"locked_canonical_snapshot_v001",snapshot_sha256:$sh,canonical_won:true,restored_title:$t}' >"$E/s06-reconciliation.json"; pass S06

          get "/api/companies/$CID"|jq . >"$E/c-budget.json"; get "/api/agents/$AID"|jq . >"$E/a-budget.json"; get "/api/issues/$IID/approvals"|jq . >"$E/approvals.json"
          [[ $(jq -r '.budgetMonthlyCents//0' "$E/c-budget.json") == 0 && $(jq -r '.spentMonthlyCents//0' "$E/c-budget.json") == 0 && $(jq -r '.budgetMonthlyCents//0' "$E/a-budget.json") == 0 && $(jq -r '.spentMonthlyCents//0' "$E/a-budget.json") == 0 && $(jq length "$E/approvals.json") == 0 ]] || fail S07 governance
          echo "canonical_human_gate=$HGT:$HGS; authority=$OWNER; paperclip_role=$ROLE" >"$E/s07-governance.txt"; pass S07

          stoppc || fail S08 stop; up && fail S08 down; echo FIRST_RUNTIME_CONFIRMED_DOWN >"$E/restart-boundary.txt"
          startpc second || fail S08 restart
          get "/api/companies/$CID"|jq . >"$E/c-restart.json"; get "/api/goals/$GID"|jq . >"$E/g-restart.json"; get "/api/projects/$PID"|jq . >"$E/p-restart.json"; get "/api/issues/$IID"|jq . >"$E/i-restart.json"; get "/api/agents/$AID"|jq . >"$E/a-restart.json"
          [[ $(jq -r .id "$E/c-restart.json") == "$CID" && $(jq -r .id "$E/g-restart.json") == "$GID" && $(jq -r .id "$E/p-restart.json") == "$PID" && $(jq -r .id "$E/i-restart.json") == "$IID" && $(jq -r .id "$E/a-restart.json") == "$AID" && $(jq -r .title "$E/i-restart.json") == "$IT" ]] || fail S08 persistence
          echo "canonical_resume_pointer=$RESUME; canonical_owner=$OWNER" >"$E/s08-resume-pointer.txt"; pass S08

          [[ -z "${GOOGLE_APPLICATION_CREDENTIALS:-}${GOOGLE_DRIVE_TOKEN:-}${GDRIVE_TOKEN:-}" ]] || fail S09 google_credential
          MS=$(git ls-remote https://github.com/domeagloco/durmbarai-website.git refs/heads/main|awk '{print $1}'); [[ "$MS" == "$MAIN_SHA_BASELINE" ]] || fail S09 main
          jq -e 'all(.[]; .==0)' "$E/side_effect_counters.json" >/dev/null || fail S09 side_effect; echo "$MS" >"$E/main-sha.txt"; pass S09

          stoppc || fail S10 cleanup; up && fail S10 health; [[ $(sha256sum "$S"|awk '{print $1}') == "$FH" ]] || fail S10 snapshot
          jq -n --arg sh "$SH" --arg ch "$CH" --arg c "$CID" --arg g "$GID" --arg p "$PID" --arg i "$IID" --arg a "$AID" --arg r "$RESUME" --arg m "$MS" '{project_id:"PRJ-019",milestone:"M11",scope:"ISOLATED_SANDBOX_ONLY",paperclip_version:"2026.722.0",canonical_snapshot_sha256:$sh,contract_sha256:$ch,company_id:$c,goal_id:$g,project_runtime_id:$p,issue_id:$i,agent_id:$a,canonical_resume_pointer:$r,main_sha_observed:$m,drift_detected:true,canonical_reconciliation:true,reverse_write_count:0,canonical_mutation_count:0,production_action_count:0,public_service_exposure_count:0,credential_provider_secret_mutation_count:0,money_commitment_count:0,main_branch_mutation_count:0}' >"$E/runtime-manifest.json"; pass S10
          [[ $(grep -c '^PASS S' "$E/results.txt") == 10 ]] || fail FINAL count
          echo M11_LIVE_SHADOW_SYNC_VERDICT=PASS | tee "$E/verdict.txt"
      - name: Upload M11 live shadow-sync evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prj019-m11-live-shadow-sync-evidence
          path: m11-evidence/
          if-no-files-found: error
          retention-days: 30
