name: Enable Human Takeover V2 Admin Once

on:
  push:
    paths:
      - '.github/workflows/enable-human-takeover-once.yml'

permissions:
  contents: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify approved addon and patch admin
        shell: bash
        run: |
          set -euo pipefail

          EXPECTED_SHA='CC13699909F486243130870CD48450E690C8FB23B24178837B23AD59DA9169FB'
          ACTUAL_SHA="$(sha256sum durmbar-human-takeover-addon.js | awk '{print toupper($1)}')"
          test "$ACTUAL_SHA" = "$EXPECTED_SHA"

          python3 - <<'PY'
          from pathlib import Path

          path = Path('admin.html')
          text = path.read_text(encoding='utf-8')
          addon = '  <script src="/durmbar-human-takeover-addon.js"></script>\n'

          if addon in text:
              raise SystemExit('Human Takeover addon is already loaded; refusing duplicate insertion')

          marker = '</body>\n</html>'
          if text.count(marker) != 1:
              raise SystemExit('Expected a single closing body/html marker')

          text = text.replace(marker, addon + '</body>\n</html>', 1)
          path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          grep -F '<script src="/durmbar-human-takeover-addon.js"></script>' admin.html

      - name: Commit bounded production change and remove one-time job
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/enable-human-takeover-once.yml
          git add admin.html
          git diff --cached --stat
          git commit -m 'feat: enable Human Takeover V2 admin addon'
          git push origin HEAD:main
