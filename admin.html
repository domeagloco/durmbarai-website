<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Durmbar AI Admin</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #111827;
    }

    .container {
      width: min(920px, calc(100% - 32px));
      margin: 40px auto;
    }

    .card {
      background: #ffffff;
      border-radius: 20px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    h2 {
      margin-top: 32px;
      margin-bottom: 14px;
    }

    .description {
      color: #64748b;
      line-height: 1.7;
      margin-bottom: 24px;
    }

    .status {
      padding: 12px 14px;
      margin-bottom: 18px;
      border-radius: 10px;
      background: #f1f5f9;
      color: #475569;
    }

    .status.success {
      background: #dcfce7;
      color: #166534;
    }

    .status.error {
      background: #fee2e2;
      color: #991b1b;
    }

    .status.loading {
      background: #dbeafe;
      color: #1e40af;
    }

    button {
      border: 0;
      border-radius: 9px;
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }

    .facebook-button {
      background: #1877f2;
      color: #ffffff;
    }

    .select-button {
      background: #0f172a;
      color: #ffffff;
      margin-top: 14px;
    }

    .pages {
      display: grid;
      gap: 14px;
    }

    .page {
      display: flex;
      align-items: center;
      gap: 16px;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 16px;
    }

    .page.selected {
      border: 2px solid #16a34a;
      background: #f0fdf4;
    }

    .page-picture {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      object-fit: cover;
      background: #e2e8f0;
      flex-shrink: 0;
    }

    .page-content {
      flex: 1;
      min-width: 0;
    }

    .page-name {
      margin: 0 0 5px;
      font-size: 18px;
    }

    .page-detail {
      color: #64748b;
      font-size: 14px;
      overflow-wrap: anywhere;
    }

    .empty {
      padding: 22px;
      border: 1px dashed #cbd5e1;
      border-radius: 12px;
      color: #64748b;
      text-align: center;
    }

    @media (max-width: 600px) {
      .card {
        padding: 22px;
      }

      .page {
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="card">
      <h1>Durmbar AI Admin</h1>

      <p class="description">
        เชื่อมต่อบัญชี Facebook เพื่อเลือกเพจที่ต้องการจัดการ
        และเปิดใช้งานระบบตอบข้อความ Messenger ของ Durmbar AI
      </p>

      <div id="status" class="status">
        ยังไม่ได้เชื่อมต่อ Facebook
      </div>

      <button
        id="loginButton"
        class="facebook-button"
        type="button"
        onclick="loginWithFacebook()"
      >
        เชื่อมต่อ Facebook
      </button>

      <h2>เพจที่คุณจัดการ</h2>

      <div id="pages" class="pages">
        <div class="empty">
          กรุณาเชื่อมต่อ Facebook เพื่อดูรายการเพจ
        </div>
      </div>
    </section>
  </main>

  <script>
    const ADMIN_API_URL =
      'https://domeagloco.app.n8n.cloud/webhook/durmbar-admin-pages';
    const SUBSCRIBE_API_URL =
  'https://domeagloco.app.n8n.cloud/webhook/durmbar-admin-subscribe';

let currentUserAccessToken = null;

    const statusBox = document.getElementById('status');
    const pagesBox = document.getElementById('pages');
    const loginButton = document.getElementById('loginButton');

    window.fbAsyncInit = function () {
      FB.init({
        appId: '2204640160434198',
        cookie: true,
        xfbml: false,
        version: 'v26.0'
      });

      setStatus('พร้อมเชื่อมต่อ Facebook');
    };

    function setStatus(message, type = '') {
      statusBox.textContent = message;
      statusBox.className = 'status';

      if (type) {
        statusBox.classList.add(type);
      }
    }

    function setLoading(isLoading) {
      loginButton.disabled = isLoading;

      loginButton.textContent = isLoading
        ? 'กำลังเชื่อมต่อ...'
        : 'เชื่อมต่อ Facebook';
    }

    function loginWithFacebook() {
      if (typeof FB === 'undefined') {
        setStatus(
          'Facebook SDK ยังโหลดไม่สำเร็จ กรุณารีเฟรชหน้าเว็บ',
          'error'
        );
        return;
      }

      setLoading(true);
      setStatus('กำลังเปิดหน้าต่าง Facebook Login...', 'loading');

      FB.login(
        function (response) {
          if (!response.authResponse) {
            setLoading(false);
            setStatus(
              'ยังไม่ได้อนุญาตการเชื่อมต่อ Facebook',
              'error'
            );
            return;
          }

          currentUserAccessToken =
  response.authResponse.accessToken;

loadManagedPages(currentUserAccessToken);
        },
        {
          scope:
            'pages_show_list,pages_manage_metadata,pages_messaging',
          return_scopes: true,
          auth_type: 'rerequest'
        }
      );
    }

    async function loadManagedPages(userAccessToken) {
      setStatus(
        'เข้าสู่ระบบสำเร็จ กำลังโหลดรายการเพจ...',
        'loading'
      );

      pagesBox.innerHTML =
        '<div class="empty">กำลังโหลดรายการเพจ...</div>';

      try {
        const response = await fetch(ADMIN_API_URL, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            access_token: userAccessToken
          })
        });

        const responseText = await response.text();

        let result;

        try {
          result = JSON.parse(responseText);
        } catch (error) {
          throw new Error(
            'API ไม่ได้ตอบกลับมาเป็น JSON'
          );
        }

        if (!response.ok) {
          throw new Error(
            result.message ||
            result.error ||
            'API ตอบกลับด้วยข้อผิดพลาด'
          );
        }

        if (!result.success) {
          throw new Error(
            result.message ||
            'ไม่สามารถโหลดรายการเพจได้'
          );
        }

        renderPages(result.pages || []);

        setLoading(false);
        setStatus(
          'เชื่อมต่อ Facebook และโหลดรายการเพจสำเร็จ',
          'success'
        );
      } catch (error) {
        console.error('Load pages error:', error);

        setLoading(false);
        setStatus(
          'โหลดรายการเพจไม่สำเร็จ: ' + error.message,
          'error'
        );

        pagesBox.innerHTML =
          '<div class="empty">ไม่สามารถแสดงรายการเพจได้</div>';
      }
    }

    function renderPages(pages) {
      pagesBox.innerHTML = '';

      if (!Array.isArray(pages) || pages.length === 0) {
        pagesBox.innerHTML =
          '<div class="empty">ไม่พบเพจที่บัญชีนี้จัดการ</div>';
        return;
      }

      pages.forEach(function (page) {
        const pageCard = document.createElement('article');
        pageCard.className = 'page';
        pageCard.dataset.pageId = page.id;

        const picture = document.createElement('img');
        picture.className = 'page-picture';
        picture.alt = 'รูปโปรไฟล์เพจ';

        picture.src =
          page.picture &&
          page.picture.data &&
          page.picture.data.url
            ? page.picture.data.url
            : '';

        const content = document.createElement('div');
        content.className = 'page-content';

        const name = document.createElement('h3');
        name.className = 'page-name';
        name.textContent = page.name || 'ไม่มีชื่อเพจ';

        const pageId = document.createElement('div');
        pageId.className = 'page-detail';
        pageId.textContent = 'Page ID: ' + page.id;

        const tasks = document.createElement('div');
        tasks.className = 'page-detail';

        tasks.textContent =
          Array.isArray(page.tasks) && page.tasks.length
            ? 'สิทธิ์: ' + page.tasks.join(', ')
            : 'ไม่พบข้อมูลงานของเพจ';

        const selectButton = document.createElement('button');
        selectButton.className = 'select-button';
        selectButton.type = 'button';
        selectButton.textContent = 'เลือกเพจนี้';

        selectButton.addEventListener('click', function () {
          selectPage(page, pageCard);
        });

        content.appendChild(name);
        content.appendChild(pageId);
        content.appendChild(tasks);
        content.appendChild(selectButton);

        pageCard.appendChild(picture);
        pageCard.appendChild(content);

        pagesBox.appendChild(pageCard);
      });
    }

    async function selectPage(page, selectedCard) {
  if (!currentUserAccessToken) {
    setStatus(
      'ไม่พบข้อมูล Facebook Login กรุณาเชื่อมต่อ Facebook ใหม่',
      'error'
    );
    return;
  }

  const selectButton =
    selectedCard.querySelector('.select-button');

  document
    .querySelectorAll('.select-button')
    .forEach(function (button) {
      button.disabled = true;
    });

  selectButton.textContent = 'กำลังเชื่อมต่อ...';

  setStatus(
    'กำลังเชื่อม Webhook ของเพจ "' + page.name + '"...',
    'loading'
  );

  try {
    const response = await fetch(SUBSCRIBE_API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({
        page_id: page.id,
        access_token: currentUserAccessToken
      })
    });

    const responseText = await response.text();

    let result;

    try {
      result = JSON.parse(responseText);
    } catch (error) {
      throw new Error('API ไม่ได้ตอบกลับมาเป็น JSON');
    }

    if (!response.ok) {
      throw new Error(
        result.message ||
        result.error ||
        'API ตอบกลับด้วยข้อผิดพลาด'
      );
    }

    if (!result.success || !result.connected) {
      throw new Error(
        result.message ||
        'Meta ยังไม่ได้ยืนยันการเชื่อมต่อ Webhook'
      );
    }

    document
      .querySelectorAll('.page')
      .forEach(function (card) {
        card.classList.remove('selected');
      });

    selectedCard.classList.add('selected');

    sessionStorage.setItem(
      'durmbar_selected_page',
      JSON.stringify({
        id: result.page_id || page.id,
        name: result.page_name || page.name,
        connected: true
      })
    );

    selectButton.textContent = 'เชื่อมต่อแล้ว';

    setStatus(
      'เชื่อมเพจ "' +
      (result.page_name || page.name) +
      '" กับ Webhook สำเร็จ',
      'success'
    );
  } catch (error) {
    console.error('Subscribe page error:', error);

    selectButton.textContent = 'เลือกเพจนี้';

    setStatus(
      'เชื่อม Webhook ไม่สำเร็จ: ' + error.message,
      'error'
    );
  } finally {
    document
      .querySelectorAll('.select-button')
      .forEach(function (button) {
        if (button.textContent !== 'เชื่อมต่อแล้ว') {
          button.disabled = false;
        }
      });
  }
}
  </script>

  <script
    async
    defer
    crossorigin="anonymous"
    src="https://connect.facebook.net/th_TH/sdk.js"
  ></script>
</body>
</html>
