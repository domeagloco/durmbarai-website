<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>R2 v25 Preview</title><style>body{margin:0;font-family:system-ui;background:#f6f2ea;color:#183c3b}.loading{min-height:100vh;display:grid;place-items:center;text-align:center;padding:28px}.loading b{font-size:1.1rem}.loading small{display:block;margin-top:7px;color:#66716e}</style></head><body><div class="loading"><div><b>กำลังเปิด R2 Bed&Pool — v25 Preview</b><small>ดึงหน้าเว็บจริง .com แล้วแสดงการปรับเฉพาะส่วนห้องพัก</small></div></div><script>(async()=>{const en=new URLSearchParams(location.search).get('lang')==='en';const source=en?'https://www.r2bedandpool.com/en/':'https://www.r2bedandpool.com/';try{let html=await fetch(source,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('HTTP '+r.status);return r.text()});html=html.replaceAll('src="/assets/','src="https://www.r2bedandpool.com/assets/').replaceAll('href="/assets/','href="https://www.r2bedandpool.com/assets/');const css=`<style id="r2-v25-preview-css">
#rooms .room-body h3{display:block;background:linear-gradient(135deg,#fffdf9,#f3ecdf);border:1px solid #e4d7be;border-left:4px solid var(--gold);border-radius:15px;padding:12px 14px;margin:9px 0 14px;box-shadow:0 8px 20px rgba(24,60,59,.06)}
#rooms .from{margin-top:16px;display:grid;gap:7px}.from-label{font-size:.74rem;color:var(--muted)}
#rooms .main-price-box{display:flex;align-items:baseline;gap:8px;width:max-content;max-width:100%;background:#eee5d5;border:1px solid #ddcca9;border-radius:14px;padding:10px 14px;box-shadow:inset 0 1px 0 rgba(255,255,255,.75)}
#rooms .main-price-box strong{display:inline;margin:0!important;font-family:'Noto Serif Thai',serif;font-size:1.7rem;color:var(--deep);font-weight:600;line-height:1.15}
#rooms .main-price-box>span{font-size:.72rem;color:#6b746f;white-space:nowrap}
#rooms .variant{align-items:center;background:#f7f5f0;border:1px solid #ebe5da;padding:11px 12px}
#rooms .rate-prices{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;white-space:normal!important}
#rooms .price-chip,#rooms .weekend-chip{display:inline-flex;align-items:center;min-height:29px;padding:4px 9px;border-radius:9px;font-size:.73rem;font-weight:600;line-height:1.2;white-space:nowrap}
#rooms .price-chip{background:#e5efec;border:1px solid #cadcd7;color:#174440}
#rooms .weekend-chip{background:#efe5d2;border:1px solid #ddc99f;color:#705626}
@media(max-width:620px){#rooms .room-body h3{font-size:1.52rem;padding:11px 12px}#rooms .main-price-box{width:100%;justify-content:flex-start;padding:11px 12px}#rooms .main-price-box strong{font-size:1.75rem}#rooms .rate-prices{justify-content:flex-start;width:100%;margin-top:4px}#rooms .variant{gap:7px}}
</style>`;const js=`<script id="r2-v25-preview-js">(()=>{const thai=document.documentElement.lang==='th';document.querySelectorAll('#rooms .room-card').forEach(card=>{const from=card.querySelector('.from');const strong=from&&from.querySelector('strong');if(strong){const m=strong.textContent.match(/[0-9,]+/);if(m){from.innerHTML='<span class="from-label">'+(thai?'เริ่มต้น':'From')+'</span><div class="main-price-box"><strong>'+(thai?m[0]+'.-':'THB '+m[0])+'</strong><span>'+(thai?'บาท/คืน':'/ night')+'</span></div>'}}card.querySelectorAll('.variant').forEach(v=>{const spans=v.querySelectorAll(':scope > span');if(spans.length<2)return;const nums=spans[1].textContent.match(/[0-9,]+/g)||[];if(nums.length>=2){spans[1].className='rate-prices';spans[1].innerHTML=thai?'<span class="price-chip">'+nums[0]+'.-</span><span class="weekend-chip">ศ–ส '+nums[1]+'.-</span>':'<span class="price-chip">THB '+nums[0]+'</span><span class="weekend-chip">Fri–Sat '+nums[1]+'</span>'}})});document.querySelectorAll('.lang-btn').forEach(a=>{if(a.getAttribute('lang')==='en')a.href=location.pathname+'?lang=en';if(a.getAttribute('lang')==='th')a.href=location.pathname});})();<\/script>`;html=html.replace('</head>','<meta name="robots" content="noindex,nofollow">'+css+'</head>').replace('</body>',js+'</body>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<div class="loading"><div><b>เปิด Preview ไม่สำเร็จ</b><small>'+e.message+'</small></div></div>'}})();</script></body></html>
