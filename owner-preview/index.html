<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>Dermbar Owner Preview</title>
  <style>
    :root{--bg:#f5f3ec;--card:#fff;--ink:#17251d;--muted:#66736b;--green:#214c35;--soft:#e8efe9;--line:#dfe5df;--amber:#f5e6b8;--red:#8a2f2f;--shadow:0 8px 30px rgba(23,37,29,.07)}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}.wrap{max-width:900px;margin:auto;padding:20px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:4px 0 18px}.brand{font-weight:800;font-size:21px}.sub{color:var(--muted);font-size:13px}.btn{border:0;border-radius:14px;padding:12px 16px;background:var(--green);color:#fff;font:inherit;font-weight:700;cursor:pointer;min-height:46px}.btn.secondary{background:#fff;color:var(--green);border:1px solid var(--line)}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}.hero{background:var(--green);color:#fff;border:none}.hero .sub{color:#d9e5dc}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.metric{padding:12px;border-radius:14px;background:rgba(255,255,255,.1)}.metric b{display:block;font-size:24px;margin-top:4px}.section-title{font-size:17px;font-weight:800;margin:0 0 12px}.action{display:flex;gap:12px;align-items:flex-start;padding:13px 0;border-top:1px solid var(--line)}.action:first-of-type{border-top:0}.prio{width:9px;height:9px;border-radius:50%;background:#b98613;margin-top:7px;flex:none}.action b{display:block;margin-bottom:3px}.action p{margin:0;color:var(--muted);font-size:14px;line-height:1.45}.askrow{display:flex;gap:8px}.askrow input,.login input{width:100%;border:1px solid var(--line);border-radius:14px;padding:13px 14px;font:inherit;font-size:16px;background:#fff}.chips{display:flex;gap:7px;overflow:auto;padding:10px 0 2px}.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-size:13px;cursor:pointer}.answer{margin-top:12px;padding:14px;border-radius:14px;background:var(--soft);line-height:1.55}.rows{margin-top:8px;font-size:13px;color:var(--muted);overflow:auto}.rows table{width:100%;border-collapse:collapse;min-width:520px}.rows th,.rows td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}.pill{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700;background:var(--soft);color:var(--green)}.pill.warn{background:var(--amber);color:#6b4b00}.pill.block{background:#f4dddd;color:var(--red)}.gate{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}.gate:first-of-type{border-top:0}.login{max-width:420px;margin:12vh auto 0}.login label{display:block;margin:12px 0 6px;font-size:14px;font-weight:700}.error{color:var(--red);font-size:14px;margin-top:10px}.hidden{display:none!important}.loading{opacity:.55;pointer-events:none}@media(min-width:720px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));}.wrap{padding-top:30px}}@media(max-width:520px){.askrow{flex-direction:column}.gate{grid-template-columns:65px 1fr}.gate .pill{grid-column:2}.top{align-items:flex-start}}
  </style>
</head>
<body>
  <div id="loginView" class="wrap">
    <div class="login card">
      <div class="brand">DERMBAR OWNER PREVIEW</div>
      <div class="sub">ใช้บัญชีเดียวกับ Dermbar CRM • Preview ภายใน</div>
      <form id="loginForm">
        <label for="username">ชื่อผู้ใช้</label>
        <input id="username" autocomplete="username" required>
        <label for="password">รหัสผ่าน</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button class="btn" style="width:100%;margin-top:16px">เข้าสู่ระบบ</button>
        <div id="loginError" class="error"></div>
      </form>
    </div>
  </div>

  <div id="appView" class="wrap hidden">
    <div class="top">
      <div><div class="brand">ผู้ช่วยเจ้าของร้าน</div><div id="viewer" class="sub"></div></div>
      <button id="logout" class="btn secondary">ออกจากระบบ</button>
    </div>
    <div class="card hero">
      <div class="sub">ร้านเมื่อคืนเป็นอย่างไร</div>
      <div id="bizDate" style="font-weight:800;font-size:18px;margin:3px 0 14px"></div>
      <div class="grid">
        <div class="metric"><span>ยอดสุทธิ</span><b id="net">—</b></div>
        <div class="metric"><span>บิล</span><b id="tx">—</b></div>
        <div class="metric"><span>ลูกค้า</span><b id="cust">—</b></div>
        <div class="metric"><span>เทียบปกติ</span><b id="diff">—</b></div>
      </div>
    </div>
    <div class="card"><div class="section-title">วันนี้ควรทำอะไร</div><div id="recommendations"></div></div>
    <div class="card">
      <div class="section-title">ถามข้อมูลร้าน</div>
      <div class="askrow"><input id="question" placeholder="เช่น เมื่อวานขายเท่าไร"><button id="askBtn" class="btn">ถาม</button></div>
      <div class="chips">
        <button class="chip">เมื่อวานขายเท่าไร</button>
        <button class="chip">ศุกร์ล่าสุดเทียบ 4 ศุกร์ก่อน</button>
        <button class="chip">เมื่อคืนโต๊ะไหนยอดสูงสุด</button>
        <button class="chip">เมนูขายดีที่สุด 10 อันดับเดือนนี้</button>
        <button class="chip">ลูกค้ายอดสูงคนไหนไม่ได้มาเกิน 30 วัน</button>
        <button class="chip">14 วันข้างหน้ามีลูกค้าวันเกิดใครบ้าง</button>
      </div>
      <div id="askAnswer" class="answer hidden"></div>
      <div id="askRows" class="rows"></div>
    </div>
    <div class="card"><div class="section-title">สถานะพร้อมใช้งาน</div><div id="readiness"></div></div>
    <div class="card"><div class="section-title">Campaign Draft</div><div id="campaigns" class="sub"></div></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL='https://ktryhrnsyylallqzildl.supabase.co';
    const SUPABASE_KEY='sb_publishable_8j4emmU4uf-D4krSLY6xwg_nmigm45s';
    const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
    const el=id=>document.getElementById(id);
    const money=n=>new Intl.NumberFormat('th-TH',{maximumFractionDigits:2}).format(Number(n||0));
    function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
    async function authEmail(username){const norm=username.trim().normalize('NFKC').toLowerCase();const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(norm));const hex=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');return 'u-'+hex.slice(0,48)+'@crm.durmbarai.com';}
    async function edge(name,body){const s=(await sb.auth.getSession()).data.session;if(!s)throw Object.assign(new Error('SESSION_REQUIRED'),{status:401});const r=await fetch(SUPABASE_URL+'/functions/v1/'+name,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+s.access_token,'apikey':SUPABASE_KEY},body:JSON.stringify(body||{})});const j=await r.json();if(!r.ok){const e=new Error(j.message||j.error||'REQUEST_FAILED');e.payload=j;e.status=r.status;throw e;}return j;}
    function showLogin(){el('appView').classList.add('hidden');el('loginView').classList.remove('hidden');}
    function showApp(){el('loginView').classList.add('hidden');el('appView').classList.remove('hidden');}
    async function load(){try{document.body.classList.add('loading');const x=await edge('owner-command-v1',{});showApp();el('viewer').textContent=((x.viewer&&x.viewer.display_name)||'')+' • '+((x.viewer&&x.viewer.role)||'');const b=(x.today&&x.today.brief)||{};el('bizDate').textContent=b.business_date||'—';el('net').textContent=money(b.net_sales)+' ฿';el('tx').textContent=money(b.transaction_count);el('cust').textContent=money(b.customer_count);el('diff').textContent=(Number(b.sales_diff_pct||0)>=0?'+':'')+money(b.sales_diff_pct)+'%';const rec=(x.today&&x.today.suggested_actions)||[];el('recommendations').innerHTML=rec.length?rec.map(a=>'<div class="action"><span class="prio"></span><div><b>'+esc(a.title)+'</b><p>'+esc(a.detail)+'</p></div></div>').join(''):'<div class="sub">ยังไม่มีเรื่องเร่งด่วน</div>';const gates=(x.release&&x.release.gates)||[];el('readiness').innerHTML=gates.map(z=>{const cls=z.status==='PASS'?'':(String(z.status).includes('BLOCKED')?'block':'warn');return '<div class="gate"><b>'+esc(z.stage)+'</b><div><b>'+esc(z.gate_name)+'</b><div class="sub">'+esc(z.detail||'')+'</div></div><span class="pill '+cls+'">'+esc(z.status)+'</span></div>';}).join('');const ds=(x.campaigns&&x.campaigns.drafts)||[];el('campaigns').innerHTML=ds.length?ds.map(c=>'<div style="padding:7px 0"><b>'+esc(c.name)+'</b> <span class="pill">'+esc(c.status)+'</span></div>').join(''):'ไม่มี Draft';}
      catch(e){console.error(e);if(e.status===401||e.status===403){await sb.auth.signOut();showLogin();el('loginError').textContent=e.status===403?'บัญชีนี้ไม่มีสิทธิ์ Owner/Manager':'Session หมดอายุ';}else{el('loginError').textContent=e.message;}}
      finally{document.body.classList.remove('loading');}}
    el('loginForm').addEventListener('submit',async e=>{e.preventDefault();el('loginError').textContent='';try{const email=await authEmail(el('username').value);const r=await sb.auth.signInWithPassword({email,password:el('password').value});if(r.error)throw r.error;await load();}catch(err){console.error(err);el('loginError').textContent='ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง';}});
    el('logout').onclick=async()=>{await sb.auth.signOut();showLogin();};
    el('askBtn').onclick=async()=>{const q=el('question').value.trim();if(!q)return;const a=el('askAnswer');a.classList.remove('hidden');a.textContent='กำลังค้นข้อมูลร้าน…';el('askRows').innerHTML='';try{const r=await edge('ask-restaurant-v1',{question:q});a.textContent=r.answer||'พบข้อมูล';const rows=(r.data||[]).slice(0,20);if(rows.length){const cols=Object.keys(rows[0]).slice(0,6);let h='<table><thead><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr></thead><tbody>';h+=rows.map(row=>'<tr>'+cols.map(c=>'<td>'+esc(row[c])+'</td>').join('')+'</tr>').join('')+'</tbody></table>';el('askRows').innerHTML=h;}}catch(e){console.error(e);a.textContent=(e.payload&&e.payload.message)||e.message;}};
    document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{el('question').value=c.textContent;el('askBtn').click();}));
    (async()=>{const existing=(await sb.auth.getSession()).data.session;if(existing)load();else showLogin();})();
  </script>
</body>
</html>
